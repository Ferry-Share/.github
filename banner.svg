<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Ferry. Hand a password, a piece of text or a file from one device to another. End to end encrypted, nothing stored, nothing logged." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ferry</title>
  <desc>A laptop and a phone on either side of a channel, with a sealed packet crossing between them.</desc>

  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0A1622"/>
      <stop offset="1" stop-color="#040A11"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.76" cy="0.58" r="0.46">
      <stop offset="0" stop-color="#7FB2E5" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7FB2E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3B45B"/>
      <stop offset="1" stop-color="#E4913A"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="1280" height="420" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .sans  { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .mark  { font-size: 82px; font-weight: 600; letter-spacing: 7px; fill: #EAF2F7; }
    .lede  { font-size: 23px; fill: #9DB4C6; }
    .meta  { font-size: 14px; fill: #63798B; letter-spacing: 1.4px; }
    .tag   { font-size: 13px; fill: #5C7183; letter-spacing: 1.2px; }

    .wave-a { animation: drift 9s linear infinite; }
    .wave-b { animation: drift 14s linear infinite reverse; }
    .lane   { animation: lane 3.2s linear infinite; }
    .boat   { transform: translateX(136px); animation: cross 7.5s cubic-bezier(.42,0,.58,1) infinite; }
    .land   { opacity: 0; animation: land 7.5s ease-out infinite; }
    .screen { animation: wake 7.5s ease-out infinite; }

    @keyframes drift { to { transform: translateX(-160px); } }
    @keyframes lane  { to { stroke-dashoffset: -32px; } }
    @keyframes cross {
      0%, 8%    { transform: translateX(0px);   opacity: 0; }
      13%       { opacity: 1; }
      64%       { transform: translateX(272px); opacity: 1; }
      70%, 100% { transform: translateX(272px); opacity: 0; }
    }
    @keyframes land {
      0%, 64%   { opacity: 0; transform: scale(0.4); }
      72%       { opacity: 0.55; }
      88%, 100% { opacity: 0; transform: scale(1.9); }
    }
    @keyframes wake {
      0%, 64%   { fill-opacity: 0.16; }
      70%       { fill-opacity: 0.55; }
      92%, 100% { fill-opacity: 0.16; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave-a, .wave-b, .lane, .boat, .land, .screen { animation: none; }
      .boat { transform: translateX(136px); opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#deep)"/>
    <rect width="1280" height="420" fill="url(#halo)"/>

    <!-- soundings: faint chart rules -->
    <g stroke="#7FB2E5" stroke-opacity="0.05">
      <path d="M0 96h1280M0 156h1280M0 216h1280M0 276h1280"/>
    </g>

    <!-- water -->
    <g transform="translate(0 352)">
      <g class="wave-a" fill="none" stroke="#7FB2E5" stroke-opacity="0.20" stroke-width="2">
        <path d="M0 18 q40 -13 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
      </g>
      <g class="wave-b" fill="none" stroke="#7FB2E5" stroke-opacity="0.11" stroke-width="2">
        <path d="M0 40 q40 -11 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
      </g>
    </g>

    <!-- wordmark -->
    <g>
      <text class="sans mark" x="80" y="180">FERRY</text>
      <rect x="82" y="206" width="78" height="3" fill="#E4913A"/>
      <text class="sans lede" x="80" y="256">Hand a password, a piece of text or a file</text>
      <text class="sans lede" x="80" y="288">from one device to another.</text>
      <text class="mono meta" x="80" y="330">no account · nothing stored · nothing logged</text>
    </g>

    <!-- the crossing -->
    <g>
      <!-- laptop -->
      <g>
        <rect x="714" y="212" width="108" height="70" rx="8" fill="#0B1B27" stroke="#33506A" stroke-width="2"/>
        <rect class="screen" x="724" y="222" width="88" height="50" rx="4" fill="#7FB2E5" fill-opacity="0.16"/>
        <path d="M702 288 h132 l12 12 h-156 z" fill="#16293A"/>
      </g>

      <!-- channel -->
      <path class="lane" d="M852 252 H1130" fill="none" stroke="#7FB2E5" stroke-opacity="0.30" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 14"/>

      <!-- phone -->
      <g>
        <rect x="1146" y="206" width="58" height="100" rx="12" fill="#0B1B27" stroke="#33506A" stroke-width="2"/>
        <rect class="screen" x="1154" y="218" width="42" height="76" rx="4" fill="#E4913A" fill-opacity="0.16"/>
        <rect x="1164" y="212" width="22" height="3" rx="1.5" fill="#33506A"/>
      </g>
      <circle class="land" cx="1175" cy="256" r="26" fill="none" stroke="#E4913A" stroke-width="2" style="transform-origin: 1175px 256px;"/>

      <!-- the packet in transit: a sealed hull -->
      <g class="boat">
        <g transform="translate(858 252)">
          <rect x="-20" y="-15" width="40" height="30" rx="9" fill="url(#hull)"/>
          <path d="M-6 -3 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#0A1622" stroke-width="2.4" stroke-linecap="round"/>
          <rect x="-8" y="-3" width="16" height="12" rx="2.5" fill="#0A1622"/>
        </g>
      </g>

      <text class="mono tag" x="768" y="336" text-anchor="middle">device a</text>
      <text class="mono tag" x="1175" y="336" text-anchor="middle">device b</text>
    </g>

    <rect x="1" y="1" width="1278" height="418" rx="18" fill="none" stroke="#1B2E3E" stroke-width="2"/>
  </g>
</svg>
